name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio-tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portfolio-tracker/package-lock.json
      - run: npm ci
      - name: Unit tests (vitest)
        run: npm test
      - name: Type check (svelte-check)
        run: npm run check
      - name: Lint (eslint)
        run: npm run lint
      - name: Build frontend
        run: npm run build
      - name: Server module loads
        run: node -e "require('./server/portfolio.js'); console.log('server ok')"
